name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    # Windows is included so it can be seen, but the tool has not been validated
    # there and the suite makes POSIX assumptions (symlinks, shell). Treat a red
    # Windows job as information, not a blocker.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install Python test runner
        run: python -m pip install pytest

      # The parser is a runtime dependency now. The lockfile makes installs
      # reproducible on every matrix entry.
      - run: npm ci --no-audit --no-fund

      - name: unit and end-to-end tests
        run: npm test

      - name: selftest (CLI over the fixture project)
        run: npm run selftest

      - name: a complete audit labels its score complete
        run: |
          node bin/crucible.js scan test/fixtures/project --json --no-cache --jobs=1 \
            --limit=all --mutations=all --select=all > complete.json || true
          node -e '
            const r = require("./complete.json");
            if (r.scoreKind !== "complete" || r.sampling?.complete !== true) {
              console.error("expected scoreKind=complete", r.scoreKind, r.sampling);
              process.exit(1);
            }
          '

      - name: generated tests must kill their target mutation
        run: node --test --test-concurrency=1 test/generated.test.js test/regression-03.test.js

      - name: the CLI starts and reports its environment
        run: node bin/crucible.js --version
